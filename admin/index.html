<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Administrativo - João Eli Kinol</title>
  <link href="config.yml" type="text/yaml" rel="cms-config-url" />
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    CMS.registerBackend('github-token', {
      init: function() {},
      authenticate: function(credentials) {
        return Promise.resolve({ token: credentials.token, provider: 'github' });
      }
    });
  </script>
</body>
</html>
