<!-- SCRIPT DE CARREGAMENTO AUTOMÁTICO DE IMÓVEIS DO GITHUB -->
  <script>
    async function loadProperties() {
      const container = document.getElementById('imoveis-grid');
      if (!container) return;

      try {
        const response = await fetch('https://api.github.com/repos/joaoelikinol/corretor/contents/content/imoveis');
        if (!response.ok) {
          container.innerHTML = '<p class="text-center text-slate-500 col-span-full py-8">Nenhum imóvel cadastrado no momento.</p>';
          return;
        }
        
        const files = await response.json();
        const markdownFiles = files.filter(file => file.name.endsWith('.md'));

        if (markdownFiles.length === 0) {
          container.innerHTML = '<p class="text-center text-slate-500 col-span-full py-8">Nenhum imóvel cadastrado no momento.</p>';
          return;
        }

        container.innerHTML = '';

        for (const file of markdownFiles) {
          const res = await fetch(file.download_url);
          const text = await res.text();

          // Limpa aspas simples e duplas dos campos capturados
          const cleanValue = (regex) => {
            const match = text.match(regex);
            return match ? match[1].replace(/['"]/g, '').trim() : '';
          };

          const title = cleanValue(/title:\s*(.+)/) || 'Imóvel sem título';
          let price = cleanValue(/price:\s*(.+)/);
          const category = cleanValue(/category:\s*(.+)/) || 'Urbano';
          const image = cleanValue(/image:\s*(.+)/) || 'https://via.placeholder.com/400x250?text=Sem+Foto';
          let area = cleanValue(/area:\s*(.+)/);
          const location = cleanValue(/location:\s*(.+)/) || 'São Miguel Arcanjo - SP';

          // Formatação visual do Preço e Área
          if (price && !price.toLowerCase().includes('r$')) {
            price = `R$ ${price}`;
          }
          if (area && !isNaN(area)) {
            area = `${area} m²`;
          }

          const cardHTML = `
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-shadow duration-300 flex flex-col justify-between">
              <div>
                <div class="relative">
                  <img src="${image}" alt="${title}" class="w-full h-52 object-cover">
                  <span class="absolute top-3 left-3 bg-amber-500 text-slate-950 font-bold text-xs px-2.5 py-1 rounded-md uppercase tracking-wider shadow">
                    ${category}
                  </span>
                </div>
                <div class="p-5">
                  <h4 class="text-xl font-bold text-slate-900 mb-2 leading-snug">${title}</h4>
                  <p class="text-slate-600 text-sm mb-4"><i class="fas fa-map-marker-alt text-amber-500 mr-1.5"></i>${location}</p>
                  <div class="flex justify-between items-center border-t border-slate-100 pt-3 text-sm">
                    <span class="font-bold text-emerald-600 text-lg">${price}</span>
                    <span class="text-slate-500 font-medium">${area}</span>
                  </div>
                </div>
              </div>
              <div class="p-5 pt-0">
                <a href="https://wa.me/5515998033288?text=Olá%20João,%20tenho%20interesse%20no%20imóvel:%20${encodeURIComponent(title)}" 
                   target="_blank" 
                   class="w-full text-center bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2 text-sm shadow-sm">
                  <i class="fab fa-whatsapp text-base"></i> Tenho Interesse
                </a>
              </div>
            </div>
          `;
          container.innerHTML += cardHTML;
        }
      } catch (error) {
        console.error('Erro ao carregar imóveis:', error);
        container.innerHTML = '<p class="text-center text-slate-500 col-span-full py-8">Erro ao carregar os imóveis. Tente novamente mais tarde.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', loadProperties);
  </script>
