<script>
  async function loadProperties() {
    const container = document.getElementById('imoveis-grid');
    if (!container) return;

    try {
      // Busca a lista de arquivos da pasta content/imoveis no GitHub
      const response = await fetch('https://api.github.com/repos/joaoelikinol/corretor/contents/content/imoveis');
      if (!response.ok) throw new Error('Falha ao buscar imóveis');
      
      const files = await response.json();
      const markdownFiles = files.filter(file => file.name.endsWith('.md'));

      if (markdownFiles.length === 0) {
        container.innerHTML = '<p class="text-center text-gray-500 col-span-full">Nenhum imóvel cadastrado no momento.</p>';
        return;
      }

      container.innerHTML = '';

      for (const file of markdownFiles) {
        const res = await fetch(file.download_url);
        const text = await res.text();

        // Extração dos campos do Markdown (Front Matter)
        const title = (text.match(/title:\s*"?([^"\n]+)"?/) || [])[1] || 'Imóvel sem título';
        const price = (text.match(/price:\s*"?([^"\n]+)"?/) || [])[1] || '';
        const category = (text.match(/category:\s*"?([^"\n]+)"?/) || [])[1] || 'Urbano';
        const image = (text.match(/image:\s*"?([^"\n]+)"?/) || [])[1] || 'https://via.placeholder.com/400x250?text=Sem+Foto';
        const area = (text.match(/area:\s*"?([^"\n]+)"?/) || [])[1] || '';
        const location = (text.match(/location:\s*"?([^"\n]+)"?/) || [])[1] || 'São Miguel Arcanjo - SP';

        const cardHTML = `
          <div class="bg-white rounded-lg shadow-md overflow-hidden hover:shadow-lg transition-shadow duration-300">
            <img src="${image}" alt="${title}" class="w-full h-48 object-cover">
            <div class="p-5">
              <span class="inline-block bg-amber-100 text-amber-800 text-xs px-2.5 py-0.5 rounded font-semibold uppercase mb-2">${category}</span>
              <h3 class="text-xl font-bold text-gray-900 mb-2">${title}</h3>
              <p class="text-gray-600 text-sm mb-3">📍 ${location}</p>
              <div class="flex justify-between items-center border-t pt-3 mt-3">
                <span class="text-lg font-bold text-emerald-600">${price}</span>
                <span class="text-sm text-gray-500">${area}</span>
              </div>
              <a href="https://wa.me/5515998033288?text=Olá%20João,%20tenho%20interesse%20no%20imóvel:%20${encodeURIComponent(title)}" 
                 target="_blank" 
                 class="mt-4 block w-full text-center bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded transition-colors">
                Tenho Interesse
              </a>
            </div>
          </div>
        `;
        container.innerHTML += cardHTML;
      }
    } catch (error) {
      console.error('Erro ao carregar imóveis:', error);
    }
  }

  document.addEventListener('DOMContentLoaded', loadProperties);
</script>
